name: Build Custom EasyEngine

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  ADVISORY_IGNORE: >-
    {
      "symfony/yaml": {
        "constraint": "4.4.*",
        "reason": "Pinned by EasyEngine and behat/behat 3.8.1",
        "on-audit": false
      },
      "guzzlehttp/psr7": {
        "constraint": "1.9.*",
        "reason": "Required by acmephp/core 1.3.0",
        "on-audit": false
      },
      "guzzlehttp/guzzle": {
        "constraint": "7.8.*",
        "reason": "Last Guzzle 7 line compatible with guzzlehttp/psr7 1.x",
        "on-audit": false
      },
      "symfony/config": {
        "constraint": "4.4.*",
        "reason": "Pinned by EasyEngine and behat/behat 3.8.1",
        "on-audit": false
      },
      "symfony/serializer": {
        "constraint": "3.4.20",
        "reason": "Pinned by site-command",
        "on-audit": false
      }
    }

jobs:
  build:
    name: Build Phar
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean vendor directory
        run: rm -rf vendor

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
          extensions: pcntl,curl,sqlite3,zip,dom,mbstring,json,phar

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Set up Composer caching
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Setup Composer authentication
        run: |
          composer config --global github-oauth.github.com \
            "${{ secrets.GITHUB_TOKEN }}"
          composer config --global repo.packagist composer \
            https://packagist.org

      - name: Configure legacy Composer advisories
        run: |
          composer config --json --merge policy.advisories.ignore \
            "$ADVISORY_IGNORE"

      - name: Install dependencies
        run: |
          composer install \
            --prefer-dist \
            --no-dev \
            --no-progress \
            --no-interaction \
            --optimize-autoloader
          composer dump-autoload \
            --optimize \
            --classmap-authoritative

      - name: Prepare for PHAR build
        run: |
          mkdir -p phar-build
          cp -r php bin utils VERSION vendor phar-build/

      - name: Build uncompressed PHAR
        run: |
          cd phar-build
          php -dphar.readonly=0 ../utils/make-phar.php \
            easyengine.phar \
            --no-compression
          chmod +x easyengine.phar
          mv easyengine.phar ../
          cd ..

      - name: Read VERSION file content
        id: get_version
        run: |
          VERSION_CONTENT="$(cat VERSION | xargs)"
          echo "VERSION_CONTENT=$VERSION_CONTENT" >> "$GITHUB_OUTPUT"

      - name: Create or replace Git tag
        id: tag
        env:
          VERSION_CONTENT: ${{ steps.get_version.outputs.VERSION_CONTENT }}
        run: |
          TAG_NAME="${VERSION_CONTENT}-custom"
          echo "TAG=$TAG_NAME" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -d "$TAG_NAME" 2>/dev/null || true
          git tag "$TAG_NAME"

          git push origin "refs/tags/$TAG_NAME" --force

      - name: Create or update release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          files: easyengine.phar
          token: ${{ secrets.GITHUB_TOKEN }}
          allow_updates: true