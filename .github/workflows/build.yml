name: Build Custom EasyEngine

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Phar
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Clean up composer files
        run: |
          rm -f composer.lock
          rm -rf vendor

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
          extensions: pcntl, curl, sqlite3, zip, dom, mbstring, json

      - name: Setup Composer authentication
        run: composer config -g github-oauth.github.com ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          composer require "easyengine/site-command:dev-develop" --no-update
          composer update --prefer-dist --no-progress --no-interaction --with-all-dependencies

      - name: Set custom version
        run: |
          echo "4.0.0-custom-$(date +%Y%m%d)-$(git rev-parse --short HEAD)" > VERSION

      - name: Build Phar
        run: php -dphar.readonly=0 utils/make-phar.php easyengine.phar

      - name: Test Phar
        run: php easyengine.phar --info

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: easyengine-custom.phar
          path: easyengine.phar
          retention-days: 5