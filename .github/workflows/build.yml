name: Build EasyEngine Phar

on:
  push:
    branches: [ "master", "develop" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Phar
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
          extensions: pcntl, curl, sqlite3, zip, dom, mbstring, json

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Set up Composer caching
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Modify composer.json to use your forks
        run: |
          sed -i 's|"easyengine/site-command": "v3.3.5"|"easyengine/site-command": "dev-develop"|' composer.json
          sed -i '/"repositories": \[/!b;n;c\    {\n      "type": "vcs",\n      "url": "https://github.com/dinhngocdung/site-command"\n    },' composer.json

      - name: Install dependencies
        run: composer update --prefer-dist --no-dev --no-progress --no-interaction

      - name: Setup EE version
        run: |
          CLI_VERSION=$(head -n 1 VERSION)
          CLI_VERSION="$(echo $CLI_VERSION | xargs)"
          CLI_VERSION+="-custom-$(git rev-parse --short HEAD)"
          echo $CLI_VERSION > VERSION

      - name: Build the Phar file
        run: php -dphar.readonly=0 utils/make-phar.php easyengine.phar

      - name: Upload built Phar file
        uses: actions/upload-artifact@v4
        with:
          name: easyengine-custom.phar
          path: easyengine.phar